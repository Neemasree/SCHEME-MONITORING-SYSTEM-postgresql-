services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govt_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - civictrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d govt_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_NAME: govt_monitoring
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      DB_HOST: db
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-local-only-secret-change-this-before-sharing}
      JWT_EXPIRES_IN: 2h
      CLIENT_ORIGIN: http://localhost:8080
      SQL_LOGGING: "false"
      DB_POOL_MAX: 10
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  civictrack_pgdata:
