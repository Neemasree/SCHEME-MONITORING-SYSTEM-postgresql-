name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, build, and dependency audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible security patches
        run: npm audit fix --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Upload validated frontend lockfile
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lockfile
          path: Frontend/package-lock.json
          if-no-files-found: error

  backend:
    name: Backend syntax, PostgreSQL integration tests, and dependency audit
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: govt_monitoring
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d govt_monitoring"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: govt_monitoring
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      JWT_SECRET: test-only-ci-secret-with-sufficient-length
      CLIENT_ORIGIN: http://localhost:5173
      SQL_LOGGING: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Synchronize manifest and lockfile, then install dependencies
        run: npm install
      - name: Apply compatible security patches
        run: npm audit fix --audit-level=high
      - name: Check JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Backend lint
        run: npm run lint
      - name: Apply database migrations to a fresh database
        run: npm run migrate
      - name: Verify migration tracking is repeatable
        run: npm run migrate
      - name: Seed disposable CI database
        run: npm run seed
      - name: Run PostgreSQL API integration tests with coverage
        run: npm test
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
      - name: Verify high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Upload validated backend lockfile
        uses: actions/upload-artifact@v7
        with:
          name: backend-lockfile
          path: backend/package-lock.json
          if-no-files-found: error

  container-build:
    name: Docker Compose configuration and image build
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download validated frontend lockfile
        uses: actions/download-artifact@v8
        with:
          name: frontend-lockfile
          path: .ci-lockfiles/frontend
      - name: Download validated backend lockfile
        uses: actions/download-artifact@v8
        with:
          name: backend-lockfile
          path: .ci-lockfiles/backend
      - name: Use lockfiles validated by lint, audit, and integration jobs
        run: |
          cp .ci-lockfiles/frontend/package-lock.json Frontend/package-lock.json
          cp .ci-lockfiles/backend/package-lock.json backend/package-lock.json
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build backend and frontend images
        run: docker compose build
      - name: Start the full stack and wait for backend health
        run: docker compose up -d --wait
      - name: Smoke-test frontend and proxied API health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/ -o /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Frontend did not become ready on port 8080."
              docker compose logs
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:5000/health
      - name: Stop smoke-test containers
        if: always()
        run: docker compose down

  persist-lockfiles:
    name: Commit tested dependency lockfile patches to main
    needs: [frontend, backend, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Download validated frontend lockfile
        uses: actions/download-artifact@v8
        with:
          name: frontend-lockfile
          path: .ci-lockfiles/frontend
      - name: Download validated backend lockfile
        uses: actions/download-artifact@v8
        with:
          name: backend-lockfile
          path: .ci-lockfiles/backend
      - name: Persist lockfiles only if this run still matches main
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$TRIGGER_SHA" ]; then
            echo "main moved while CI ran; skipping the lockfile commit to avoid overwriting newer changes."
            exit 0
          fi

          cp .ci-lockfiles/frontend/package-lock.json Frontend/package-lock.json
          cp .ci-lockfiles/backend/package-lock.json backend/package-lock.json

          if git diff --quiet -- Frontend/package-lock.json backend/package-lock.json; then
            echo "Dependency lockfiles are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/package-lock.json backend/package-lock.json
          git commit -m "chore: apply tested dependency security patches"
          git push origin HEAD:main
