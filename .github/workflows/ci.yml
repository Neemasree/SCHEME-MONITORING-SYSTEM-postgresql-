name: CI

on:
  push:
    branches: [main, security-hardening]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  backend:
    name: Backend syntax and PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: govt_monitoring
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d govt_monitoring"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: govt_monitoring
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      JWT_SECRET: test-only-ci-secret-with-sufficient-length
      CLIENT_ORIGIN: http://localhost:5173
      SQL_LOGGING: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Backend lint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Apply database migrations
        run: npm run migrate
      - name: Seed disposable CI database
        run: npm run seed
      - name: Run PostgreSQL API integration tests
        run: npm test
